name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb dbus-x11 google-chrome-stable || true
        if ! command -v google-chrome &> /dev/null; then
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
        fi

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        seleniumbase install chromedriver

    - name: Run Auto Renew Script (SeleniumBase UC Mode)
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        HEADLESS: 'true'
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python renew_katabump.py

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
