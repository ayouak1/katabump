name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  actions: write # 用于自我续命，防止 60 天无活动被 GitHub 停用定时任务

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    # 恢复上次运行刷新过的登录会话（滚动续命，免登录页 Turnstile）
    - name: Restore session cache
      uses: actions/cache/restore@v4
      with:
        path: session_cookies.json
        key: katabump-session-${{ github.run_id }}
        restore-keys: |
          katabump-session-

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb dbus-x11 xdotool google-chrome-stable || true
        if ! command -v google-chrome &> /dev/null; then
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
        fi

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyautogui Pillow
        pip install -r requirements.txt
        seleniumbase install chromedriver

    - name: Run Auto Renew Script (SeleniumBase UC Mode)
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        HTTPS_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python renew_katabump.py

    # 无论成败都保存最新会话，供下次运行使用
    - name: Save session cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: session_cookies.json
        key: katabump-session-${{ github.run_id }}

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/

    # 防止仓库长期无提交导致定时任务被 GitHub 自动停用（60 天规则）
    - name: Keep workflow alive
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow enable "Katabump Auto Renew" --repo "$GITHUB_REPOSITORY" || true
